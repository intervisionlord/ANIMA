[changelog]
header = """
# Ченджлог

Все значимые изменения собраны здесь. Сообщения коммитов следуют Conventional Commits.\n
"""
body = """
{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
      {% if commit.breaking %}**[breaking]** {% endif %}\
      {{ commit.message | upper_first }} \
      ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/intervisionlord/ANIMA/commit/{{ commit.id }}))\
{%- endmacro -%}
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%d.%m.%Y") }}
{% else %}\
    ## Неопубликованное
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        {{ self::print_commit(commit=commit) }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
---

Сгенерировано [git-cliff](https://github.com/orhun/git-cliff).\n
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = '^[a-z]+(\(.+\))?!:', group = '💥 Критические изменения' },
    { message = '^feat', group = '🚀 Новое' },
    { message = '^fix', group = '🐛 Исправления' },
    { message = '^perf', group = '⚡ Производительность' },
    { message = '^refactor', group = '🧹 Рефакторинг' },
    { message = '^doc', group = '📚 Документация' },
    { message = '^test', group = '🧪 Тесты' },
    { message = '^style', group = '🎨 Стиль' },
    { message = '^build', group = '📦 Сборка' },
    { message = '^ci', group = '🤖 CI' },
    { message = '^chore\(release\): prepare for', skip = true },
    { message = '^chore', group = '🔧 Разное' },
    { body = '(?i)breaking change', group = '💥 Критические изменения' },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = 'v[0-9].*'
ignore_tags = ''
topo_order = false
sort_commits = 'newest'
